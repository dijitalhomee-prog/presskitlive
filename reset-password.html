<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <script>
    if (window.location.protocol === 'file:') {
      const page = window.location.pathname.split('/').pop() || 'reset-password.html';
      window.location.href = 'http://localhost:8080/' + page + window.location.search + window.location.hash;
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şifre Sıfırlama — PressKitLive | DijitalGru</title>
  <meta name="description" content="PressKitLive hesabınız için yeni şifre belirleyin. DijitalGru altyapısı.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="/style.css">
  <style>
    .login-body {
      background: radial-gradient(circle at top center, #1e2923 0%, #0a0a0a 70%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #fff;
    }
    .login-nav {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .login-container {
      max-width: 480px;
      width: 100%;
      margin: 40px auto;
      padding: 0 20px;
    }
    .login-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 40px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    }
  </style>
</head>
<body class="login-body">

  <nav class="login-nav">
    <a href="landing.html" class="agency-brand" style="text-decoration:none;">
      <i data-lucide="disc" style="color: var(--primary);"></i>
      <span>PressKit<span style="color: var(--primary);">Live</span></span>
    </a>
    <a href="login.html" class="btn btn-outline btn-small">
      <i data-lucide="log-in"></i> Giriş Yap
    </a>
  </nav>

  <div class="login-container">
    <div class="login-card">
      <div style="text-align:center; margin-bottom:24px;">
        <div style="width:56px; height:56px; border-radius:50%; background:rgba(29,185,84,0.15); color:var(--primary); display:flex; align-items:center; justify-content:center; margin:0 auto 16px;">
          <i data-lucide="key-round" style="width:28px; height:28px;"></i>
        </div>
        <h2 style="font-family:var(--font-display); font-size:24px; font-weight:900; color:#fff;">Yeni Şifre Belirleyin</h2>
        <p style="font-size:13px; color:var(--text-muted); margin-top:6px;">Lütfen en az 8 karakterli ve en az 1 rakam içeren yeni bir şifre girin.</p>
      </div>

      <div id="alertBox" style="display:none; padding:14px; border-radius:8px; margin-bottom:20px; font-size:13px;"></div>

      <form id="resetPasswordForm" onsubmit="handleResetPasswordSubmit(event)">
        <div class="form-group">
          <label>Yeni Şifre *</label>
          <input type="password" id="inputNewPassword" placeholder="En az 8 karakter, 1 rakam" required minlength="8">
        </div>

        <div class="form-group">
          <label>Yeni Şifre (Tekrar) *</label>
          <input type="password" id="inputConfirmPassword" placeholder="Şifrenizi tekrar girin" required minlength="8">
        </div>

        <button type="submit" class="btn btn-spotify btn-block btn-large" style="margin-top:16px;" id="btnSubmitReset">
          <i data-lucide="check-circle-2"></i> Şifremi Güncelle
        </button>
      </form>
    </div>
  </div>

  <footer class="app-footer-premium" style="max-width: 1200px; margin: 40px auto 20px;">
    <div class="footer-bottom-bar" style="border:none;">
      <span>© 2026 PressKitLive. Tüm Hakları Saklıdır.</span>
      <span>Bir <a href="https://dijitalgru.com/" target="_blank" style="color:var(--primary); font-weight:700;">DijitalGru™ Yazılım Teknolojisi</a></span>
    </div>
  </footer>

  <script>
    if (window.lucide) lucide.createIcons();

    let resetToken = '';

    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      resetToken = params.get('token') || '';

      const alertBox = document.getElementById('alertBox');
      if (!resetToken) {
        showAlert('Geçersiz sıfırlama bağlantısı. Lütfen tekrar şifre sıfırlama talebinde bulunun.', 'error');
        document.getElementById('btnSubmitReset').disabled = true;
      }
    });

    function showAlert(msg, type) {
      const box = document.getElementById('alertBox');
      box.style.display = 'block';
      if (type === 'error') {
        box.style.background = 'rgba(239, 68, 68, 0.15)';
        box.style.color = '#ef4444';
        box.style.border = '1px solid rgba(239, 68, 68, 0.4)';
      } else {
        box.style.background = 'rgba(34, 197, 94, 0.15)';
        box.style.color = '#22c55e';
        box.style.border = '1px solid rgba(34, 197, 94, 0.4)';
      }
      box.innerHTML = msg;
    }

    async function handleResetPasswordSubmit(e) {
      e.preventDefault();
      const pwd = document.getElementById('inputNewPassword').value;
      const pwdConfirm = document.getElementById('inputConfirmPassword').value;
      const btn = document.getElementById('btnSubmitReset');

      if (pwd !== pwdConfirm) {
        showAlert('Şifreler birbiriyle eşleşmiyor!', 'error');
        return;
      }

      if (pwd.length < 8 || !/\d/.test(pwd)) {
        showAlert('Şifreniz en az 8 karakter olmalı ve en az 1 rakam içermelidir.', 'error');
        return;
      }

      btn.disabled = true;

      try {
        const res = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: resetToken, password: pwd })
        });
        const data = await res.json();
        if (data.status === 'success') {
          showAlert('✅ Şifreniz başarıyla güncellendi! 3 saniye içinde giriş sayfasına yönlendiriliyorsunuz...', 'success');
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 2500);
        } else {
          showAlert(data.message || 'Şifre güncellenemedi.', 'error');
          btn.disabled = false;
        }
      } catch (err) {
        showAlert('Sunucuya bağlanılamadı.', 'error');
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
